# ── Prefix ────────────────────────────────────────────────────────────────────
# Change prefix from Ctrl-b to Ctrl-a (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"   # proper color support
set -g history-limit 10000                # scrollback buffer
set -g mouse on                           # mouse: click panes, scroll, resize
set -g base-index 1                       # windows start at 1 (not 0)
setw -g pane-base-index 1                 # panes start at 1 too
set -g renumber-windows on                # renumber when a window is closed
set -s escape-time 0                      # no delay after pressing Escape

# ── Key bindings ──────────────────────────────────────────────────────────────
# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes with | and - (more intuitive than " and %)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigate panes with Alt+arrow (no prefix needed)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Navigate windows with Shift+arrow (no prefix needed)
bind -n S-Left  previous-window
bind -n S-Right next-window

# Swap windows
bind-key -n C-S-Left swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1

# kill pane without confirmation
bind-key -T prefix x kill-pane

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=colour235,fg=colour136"
set -g status-left  " #S "                          # session name on the left
set -g status-right " %H:%M  %d %b "               # time and date on the right
set -g status-left-length 20
set -g status-right-length 30

# Highlight the active window in the status bar
setw -g window-status-current-style "bg=colour166,fg=colour15,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# ── Copy mode ─────────────────────────────────────────────────────────────────
setw -g mode-keys vi                      # use vi keys in copy mode
bind Enter copy-mode                      # enter copy mode with prefix+Enter
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel


set -g xterm-keys on
set -g extended-keys on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'   # auto-restore on tmux start
set -g @continuum-save-interval '15'  # save every 15 minutes
run '~/.tmux/plugins/tpm/tpm'


# Navigate sessions
bind -n M-S-Left  switch-client -p
bind -n M-S-Right switch-client -n


# native tabs feel
bind -n C-t new-window
bind -n C-k previous-window
bind -n C-j next-window
bind -n C-w kill-window
#set -g status-position top
#set -g status-justify left
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bold]#I:#W "
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'


